# Host routing + TLS — placeholder until cluster details arrive (D-016).
# Requires: nginx-ingress controller + cert-manager with a DNS-01 ClusterIssuer
# (wildcard *.apnacity.com — matches D-009 single-level shop subdomains).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: apnacity
  namespace: apnacity
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-dns01 # to be created on the server
    nginx.ingress.kubernetes.io/proxy-body-size: 12m  # product image uploads
spec:
  ingressClassName: nginx
  tls:
    - hosts: ["apnacity.com", "*.apnacity.com"]
      secretName: apnacity-wildcard-tls
  rules:
    # marketplace + city sites + ALL shop storefronts → web (tenant resolved in-app)
    - host: "{apnacity.com,www.apnacity.com,*.apnacity.com}" # split into rules on install
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: web, port: { number: 80 } } }
    - host: api.apnacity.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: api, port: { number: 80 } } }
    - host: seller.apnacity.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: seller-portal, port: { number: 80 } } }
    - host: admin.apnacity.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: admin-portal, port: { number: 80 } } }
