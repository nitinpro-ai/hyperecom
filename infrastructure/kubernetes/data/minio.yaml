# MinIO — S3-compatible object storage (product images, KYC docs) for dev.
# Buckets apnacity-media (public) / apnacity-docs (private) are created by
# deploy-dev.sh after first boot. LAN console: 192.168.2.224:30901
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-data
  namespace: apnacity
spec:
  accessModes: ["ReadWriteOnce"]
  resources: { requests: { storage: 20Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: apnacity
  labels: { app: minio, app.kubernetes.io/part-of: apnacity }
spec:
  replicas: 1
  selector: { matchLabels: { app: minio } }
  template:
    metadata:
      labels: { app: minio }
    spec:
      containers:
        - name: minio
          image: minio/minio:latest
          args: ["server", "/data", "--console-address", ":9001"]
          env:
            - { name: MINIO_ROOT_USER, value: apnacity }
            - { name: MINIO_ROOT_PASSWORD, value: apnacity-secret } # DEV ONLY
          ports:
            - { containerPort: 9000, name: s3 }
            - { containerPort: 9001, name: console }
          readinessProbe:
            httpGet: { path: /minio/health/ready, port: 9000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "1", memory: 1Gi }
          volumeMounts:
            - { name: data, mountPath: /data }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: minio-data }
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: apnacity
spec:
  selector: { app: minio }
  ports:
    - { name: s3, port: 9000, targetPort: 9000 }
    - { name: console, port: 9001, targetPort: 9001 }
---
# NodePort for LAN testing (uploads from the Mac / storefront image URLs)
apiVersion: v1
kind: Service
metadata:
  name: minio-external
  namespace: apnacity
spec:
  type: NodePort
  selector: { app: minio }
  ports:
    - { name: s3, port: 9000, targetPort: 9000, nodePort: 30900 }
    - { name: console, port: 9001, targetPort: 9001, nodePort: 30901 }
