# ApnaCity admin-portal — LAN NodePort 30082.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-portal
  namespace: apnacity
  labels: { app: admin-portal, app.kubernetes.io/part-of: apnacity }
spec:
  replicas: 1
  selector: { matchLabels: { app: admin-portal } }
  template:
    metadata:
      labels: { app: admin-portal }
    spec:
      containers:
        - name: admin-portal
          image: localhost:32000/hyperecom-admin:latest
          ports: [{ containerPort: 3002 }]
          readinessProbe:
            httpGet: { path: /, port: 3002 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: 3002 }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { cpu: 500m, memory: 384Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: admin-portal
  namespace: apnacity
spec:
  selector: { app: admin-portal }
  ports: [{ port: 80, targetPort: 3002 }]
---
# LAN access: http://192.168.2.224:30282
apiVersion: v1
kind: Service
metadata:
  name: admin-portal-external
  namespace: apnacity
spec:
  type: NodePort
  selector: { app: admin-portal }
  ports: [{ port: 80, targetPort: 3002, nodePort: 30282 }]
