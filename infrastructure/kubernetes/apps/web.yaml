# ApnaCity web (marketplace + city + shop storefronts) — LAN NodePort 30080.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: apnacity
  labels: { app: web, app.kubernetes.io/part-of: apnacity }
spec:
  replicas: 2
  selector: { matchLabels: { app: web } }
  template:
    metadata:
      labels: { app: web }
    spec:
      containers:
        - name: web
          image: localhost:32000/hyperecom-web:latest
          ports: [{ containerPort: 3000 }]
          readinessProbe:
            httpGet: { path: /, port: 3000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: 3000 }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: 150m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: apnacity
spec:
  selector: { app: web }
  ports: [{ port: 80, targetPort: 3000 }]
---
# LAN access: http://192.168.2.224:30280
apiVersion: v1
kind: Service
metadata:
  name: web-external
  namespace: apnacity
spec:
  type: NodePort
  selector: { app: web }
  ports: [{ port: 80, targetPort: 3000, nodePort: 30280 }]

