# ApnaCity seller-portal (PWA) — LAN NodePort 30081.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seller-portal
  namespace: apnacity
  labels: { app: seller-portal, app.kubernetes.io/part-of: apnacity }
spec:
  replicas: 1
  selector: { matchLabels: { app: seller-portal } }
  template:
    metadata:
      labels: { app: seller-portal }
    spec:
      containers:
        - name: seller-portal
          image: localhost:32000/hyperecom-seller:latest
          ports: [{ containerPort: 3001 }]
          readinessProbe:
            httpGet: { path: /, port: 3001 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: 3001 }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { cpu: 500m, memory: 384Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: seller-portal
  namespace: apnacity
spec:
  selector: { app: seller-portal }
  ports: [{ port: 80, targetPort: 3001 }]
---
# LAN access: http://192.168.2.224:30281
apiVersion: v1
kind: Service
metadata:
  name: seller-portal-external
  namespace: apnacity
spec:
  type: NodePort
  selector: { app: seller-portal }
  ports: [{ port: 80, targetPort: 3001, nodePort: 30281 }]
