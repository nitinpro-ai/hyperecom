# ApnaCity API — Deployment + Service + HPA + LAN NodePort.
# Dev images from the in-cluster registry (microk8s `registry` addon, :32000).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: apnacity
  labels: { app: api, app.kubernetes.io/part-of: apnacity }
spec:
  replicas: 2
  selector: { matchLabels: { app: api } }
  template:
    metadata:
      labels: { app: api }
    spec:
      containers:
        - name: api
          image: localhost:32000/hyperecom-api:latest
          ports: [{ containerPort: 4000 }]
          envFrom:
            - secretRef: { name: apnacity-env }
          readinessProbe:
            httpGet: { path: /v1/health, port: 4000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /v1/health, port: 4000 }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: 200m, memory: 384Mi }
            limits: { cpu: "1", memory: 768Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: apnacity
spec:
  selector: { app: api }
  ports: [{ port: 80, targetPort: 4000 }]
---
# LAN access: http://192.168.2.224:30400/v1/health
apiVersion: v1
kind: Service
metadata:
  name: api-external
  namespace: apnacity
spec:
  type: NodePort
  selector: { app: api }
  ports: [{ port: 80, targetPort: 4000, nodePort: 30400 }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
  namespace: apnacity
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: api }
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }

