name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (typecheck-based until eslint lands in Step 4)
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build all apps + packages
        run: pnpm build

  # Step 3 adds: integration job (compose db/redis/minio + migrate + test:integration)
  #             api-client regeneration check, tenant-isolation suite, deploy-staging on main.
